limit_req_zone $binary_remote_addr zone=paws_api:10m rate=20r/s;
map $request_method $paws_upload_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $paws_upload_key zone=paws_upload:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name pawsrescue.example.com;

    client_max_body_size 35M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /api/lost-pets {
        limit_req zone=paws_upload burst=3 nodelay;
        proxy_pass http://127.0.0.1:3015/lost-pets;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 190s;
    }

    location = /api/lost-pets/match {
        limit_req zone=paws_upload burst=3 nodelay;
        proxy_pass http://127.0.0.1:3015/lost-pets/match;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 190s;
    }

    location /api/ {
        limit_req zone=paws_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3015/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 190s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }
}
