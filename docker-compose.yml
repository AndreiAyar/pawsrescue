services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    container_name: pawsrescue-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pawsrescue}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pawsrescue}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pawsrescue-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      ai:
        condition: service_started
    environment:
      PORT: 3015
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST_NEST: db
      DB_PORT_NEST: 5432
      DB_USER_NEST: ${POSTGRES_USER:-postgres}
      DB_PASSWORD_NEST: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME_NEST: ${POSTGRES_DB:-pawsrescue}
      AI_SERVICE_URL: http://ai:8000
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-180000}
      AI_MATCH_MAX_DISTANCE: ${AI_MATCH_MAX_DISTANCE:-0.5}
      USE_MOCK_DATA: ${USE_MOCK_DATA:-false}
      UPLOAD_DIR: /shared-uploads
    ports:
      - "127.0.0.1:${API_PORT:-3015}:3015"
    volumes:
      - shared-uploads:/shared-uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_MAPTILER_API_KEY: ${NEXT_PUBLIC_MAPTILER_API_KEY:-}
    container_name: pawsrescue-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      PORT: 3060
      API_URL: http://api:3015
      API_PROXY_ENABLED: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-3060}:3060"

  ai:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    container_name: pawsrescue-ai
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST_NEST: db
      DB_PORT_NEST: 5432
      DB_USER_NEST: ${POSTGRES_USER:-postgres}
      DB_PASSWORD_NEST: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME_NEST: ${POSTGRES_DB:-pawsrescue}
      DB_SSL: "false"
      UPLOAD_DIR: /shared-uploads
      AI_PORT: 8000
      AI_MODEL_NAME: ${AI_MODEL_NAME:-auto}
      AI_TRANSFORMERS_MODEL_NAME: ${AI_TRANSFORMERS_MODEL_NAME:-facebook/dinov2-small}
      AI_OFFLINE_MODEL_LOAD: ${AI_OFFLINE_MODEL_LOAD:-false}
      AI_TARGET_EMBEDDING_DIM: ${AI_TARGET_EMBEDDING_DIM:-1024}
      AI_CAT_DETECTION_THRESHOLD: ${AI_CAT_DETECTION_THRESHOLD:-0.65}
      AI_CAT_CROP_PADDING: ${AI_CAT_CROP_PADDING:-0.08}
      AI_CAT_CROP_WEIGHT: ${AI_CAT_CROP_WEIGHT:-0.8}
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    volumes:
      - shared-uploads:/shared-uploads:ro
      - ai-cache:/home/appuser/.cache

volumes:
  redis-data:
  postgres-data:
  shared-uploads:
  ai-cache:
