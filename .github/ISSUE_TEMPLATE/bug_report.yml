name: Bug report
description: Something is broken or difficult to reproduce.
body:
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Web UI or map
        - Photo matching or Python worker
        - API or database
        - Setup or Docker
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Include the command or steps, expected behavior, and actual behavior. Use fictional reports.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node/Python/Docker versions, and commit if known.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: Remove credentials, connection strings, contact details, and private locations. Report vulnerabilities using SECURITY.md.
