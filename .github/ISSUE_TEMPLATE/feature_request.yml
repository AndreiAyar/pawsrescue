name: Feature request
description: Suggest an improvement that helps people report or find animals.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who needs this, and what happens today?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Suggested behavior
      description: Describe a small, concrete improvement and any alternatives.
    validations:
      required: true
